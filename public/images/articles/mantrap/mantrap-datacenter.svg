<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data center mantrap airlock showing outer door vestibule and inner door with credential readers occupancy detection locks and CCTV camera">
  <rect width="800" height="460" fill="#f8fafc"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Mantrap (Airlock) — Data Center Entry</text>

  <!-- OUTSIDE AREA -->
  <rect x="20" y="55" width="165" height="320" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="103" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Outside / Lobby</text>

  <!-- VESTIBULE -->
  <rect x="240" y="55" width="320" height="320" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0369a1">Secure Vestibule</text>
  <text x="400" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#0284c7">Controlled Space — One Person at a Time</text>

  <!-- SECURE AREA -->
  <rect x="615" y="55" width="165" height="320" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="697" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#15803d">Secure Area</text>
  <text x="697" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#166534">Server Hall</text>

  <!-- OUTER DOOR -->
  <rect x="185" y="115" width="55" height="200" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="212" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#1e40af" writing-mode="tb">OUTER DOOR</text>
  <!-- EM lock outer top -->
  <rect x="185" y="113" width="55" height="10" rx="2" fill="#1e40af"/>
  <text x="212" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#bfdbfe">EM LOCK</text>

  <!-- INNER DOOR -->
  <rect x="560" y="115" width="55" height="200" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="2.5"/>
  <text x="587" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#14532d" writing-mode="tb">INNER DOOR</text>
  <!-- EM lock inner top -->
  <rect x="560" y="113" width="55" height="10" rx="2" fill="#15803d"/>
  <text x="587" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#bbf7d0">EM LOCK</text>

  <!-- OUTER READER (left of outer door) -->
  <rect x="148" y="185" width="34" height="60" rx="5" fill="#1e40af"/>
  <rect x="153" y="192" width="24" height="16" rx="2" fill="#3b82f6"/>
  <circle cx="165" cy="224" r="7" fill="#60a5fa"/>
  <text x="165" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#1e3a8a" font-weight="600">Reader 1</text>

  <!-- INNER READER (left of inner door, inside vestibule) -->
  <rect x="524" y="185" width="34" height="60" rx="5" fill="#15803d"/>
  <rect x="529" y="192" width="24" height="16" rx="2" fill="#22c55e"/>
  <circle cx="541" cy="224" r="7" fill="#4ade80"/>
  <text x="541" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#14532d" font-weight="600">Reader 2</text>

  <!-- OCCUPANCY SENSOR in vestibule ceiling -->
  <rect x="358" y="66" width="84" height="22" rx="5" fill="#7c3aed"/>
  <text x="400" y="81" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#fff" font-weight="600">Occupancy Sensor</text>

  <!-- CCTV in vestibule -->
  <polygon points="296,70 316,80 316,100 296,110" fill="#1e293b"/>
  <rect x="280" y="78" width="18" height="26" rx="3" fill="#334155"/>
  <text x="298" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#475569" font-weight="600">CCTV</text>

  <!-- INTERLOCK CONTROLLER -->
  <rect x="320" y="330" width="160" height="40" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f1f5f9">Interlock Controller</text>
  <text x="400" y="362" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">One Door Open at a Time Logic</text>

  <!-- Person in vestibule -->
  <circle cx="400" cy="185" r="14" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <ellipse cx="400" cy="215" rx="16" ry="10" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e" font-weight="600">1 Person</text>
  <text x="400" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">Authenticated</text>

  <!-- Emergency release note -->
  <rect x="248" y="285" width="304" height="30" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e" font-weight="600">Emergency release per approved life-safety design and AHJ requirements</text>

  <!-- Labels -->
  <text x="103" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Public</text>
  <text x="103" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Access</text>
  <text x="697" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#15803d">Restricted</text>
  <text x="697" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#15803d">Access</text>

  <!-- Rule box -->
  <rect x="20" y="395" width="760" height="52" rx="7" fill="#1e293b"/>
  <text x="400" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f1f5f9">Core Rule: Only ONE door can be open at any time. Outer open → Inner locked. Inner open → Outer locked.</text>
  <text x="400" y="434" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">Occupancy detection prevents inner door opening when more than one person is detected in vestibule.</text>
</svg>
