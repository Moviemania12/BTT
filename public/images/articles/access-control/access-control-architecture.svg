<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Access control system architecture showing credential reader connected to access controller which connects to management server, door lock, door contact, REX, with integration paths to CCTV and fire alarm interface">
  <rect width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Access Control System Architecture</text>

  <!-- CREDENTIAL box -->
  <rect x="30" y="180" width="110" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e40af">Credential</text>
  <text x="85" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#3b82f6">Card / PIN /</text>
  <text x="85" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#3b82f6">Biometric</text>

  <!-- READER -->
  <rect x="190" y="180" width="110" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="245" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#6d28d9">Reader</text>
  <text x="245" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">Wiegand / OSDP</text>
  <text x="245" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">protocol</text>

  <!-- arrow: credential → reader -->
  <line x1="140" y1="208" x2="188" y2="208" stroke="#3b82f6" stroke-width="2" marker-end="url(#a1)"/>

  <!-- ACCESS CONTROLLER (center) -->
  <rect x="350" y="155" width="140" height="106" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="420" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Access</text>
  <text x="420" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Controller</text>
  <text x="420" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Authenticate</text>
  <text x="420" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Policy Check</text>
  <text x="420" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Local Decision</text>
  <text x="420" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Event Log</text>

  <!-- arrow: reader → controller -->
  <line x1="300" y1="208" x2="348" y2="208" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>

  <!-- MANAGEMENT SERVER -->
  <rect x="570" y="155" width="130" height="106" rx="10" fill="#0f172a" stroke="#1e40af" stroke-width="2"/>
  <text x="635" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">Access Mgmt</text>
  <text x="635" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">Server / Software</text>
  <text x="635" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Credential Enrollment</text>
  <text x="635" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Policy Config</text>
  <text x="635" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Reporting / Audit</text>
  <text x="635" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Integrations</text>

  <!-- arrow: controller ↔ server (double) -->
  <line x1="490" y1="204" x2="568" y2="204" stroke="#38bdf8" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="568" y1="214" x2="490" y2="214" stroke="#38bdf8" stroke-width="2" marker-end="url(#a4)"/>
  <text x="529" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#0ea5e9">TCP/IP Sync</text>

  <!-- FIELD DEVICES (below controller) -->
  <!-- Door Lock -->
  <rect x="310" y="310" width="100" height="46" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="360" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#92400e">Door Lock</text>
  <text x="360" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#a16207">EM Lock / Electric Strike</text>

  <!-- Door Contact -->
  <rect x="425" y="310" width="100" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="475" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#14532d">Door Contact</text>
  <text x="475" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#166534">Status Sensor</text>

  <!-- REX -->
  <rect x="310" y="375" width="215" height="46" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="418" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#9f1239">REX — Request to Exit</text>
  <text x="418" y="409" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#be123c">PIR Motion / Push Button</text>

  <!-- Controller to field devices -->
  <line x1="380" y1="261" x2="360" y2="310" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a5)"/>
  <line x1="420" y1="261" x2="440" y2="310" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a6)"/>
  <line x1="420" y1="261" x2="420" y2="375" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a7)"/>

  <!-- INTEGRATION PATHS (right side) -->
  <!-- CCTV -->
  <rect x="686" y="310" width="110" height="42" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="741" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#15803d">CCTV / VMS</text>
  <text x="741" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#166534">Event-linked video</text>

  <!-- Fire Alarm Interface -->
  <rect x="686" y="370" width="110" height="46" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="741" y="388" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#c2410c">Fire Alarm</text>
  <text x="741" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#c2410c">Interface</text>
  <text x="741" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="#9a3412">Per approved design &amp; AHJ</text>

  <!-- Server → integrations -->
  <line x1="700" y1="220" x2="741" y2="310" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a8)"/>
  <line x1="700" y1="230" x2="741" y2="370" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a9)"/>

  <!-- Note -->
  <rect x="30" y="310" width="260" height="110" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="42" y="328" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Design Notes</text>
  <text x="42" y="344" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• Controller stores credentials locally —</text>
  <text x="42" y="357" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  operates standalone if server offline</text>
  <text x="42" y="372" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• Life-safety lock release behavior per</text>
  <text x="42" y="385" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  approved design &amp; AHJ requirements</text>
  <text x="42" y="400" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• OSDP preferred over Wiegand for</text>
  <text x="42" y="413" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  reader-controller security</text>

  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#7c3aed"/></marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#38bdf8"/></marker>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#38bdf8"/></marker>
    <marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f59e0b"/></marker>
    <marker id="a6" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="a7" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#e11d48"/></marker>
    <marker id="a8" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="a9" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ea580c"/></marker>
  </defs>
</svg>
