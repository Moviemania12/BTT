<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biometric authentication system architecture showing user biometric capture flowing to template matching engine then authentication decision then access controller and door, with optional second factor card credential">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Biometric Authentication — System Architecture</text>

  <!-- STEP boxes (horizontal flow) -->
  <!-- 1. USER -->
  <rect x="20" y="160" width="90" height="80" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <circle cx="65" cy="187" r="16" fill="#bfdbfe"/>
  <ellipse cx="65" cy="220" rx="20" ry="10" fill="#bfdbfe"/>
  <text x="65" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#1e40af">User</text>

  <!-- 2. BIOMETRIC CAPTURE -->
  <rect x="140" y="145" width="115" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="197" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Biometric</text>
  <text x="197" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Capture</text>
  <!-- icons row -->
  <!-- fingerprint mini -->
  <ellipse cx="175" cy="210" rx="14" ry="16" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M168 202 Q175 194 182 202" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- face mini -->
  <circle cx="197" cy="207" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="193" cy="204" r="2" fill="#7c3aed"/>
  <circle cx="201" cy="204" r="2" fill="#7c3aed"/>
  <path d="M192 212 Q197 216 202 212" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- iris mini -->
  <circle cx="219" cy="207" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="219" cy="207" r="8" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="219" cy="207" r="3" fill="#7c3aed"/>
  <text x="197" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">Fingerprint / Face / Iris</text>

  <!-- arrow 1 -->
  <line x1="110" y1="200" x2="138" y2="200" stroke="#7c3aed" stroke-width="2" marker-end="url(#c1)"/>

  <!-- 3. TEMPLATE MATCHING -->
  <rect x="280" y="145" width="120" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="340" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#92400e">Template /</text>
  <text x="340" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#92400e">Matching Engine</text>
  <text x="340" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">Extract features</text>
  <text x="340" y="213" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">Compare to enrolled</text>
  <text x="340" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">template</text>
  <text x="340" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#a16207">(on reader / server)</text>

  <!-- arrow 2 -->
  <line x1="255" y1="200" x2="278" y2="200" stroke="#ca8a04" stroke-width="2" marker-end="url(#c2)"/>

  <!-- 4. AUTH DECISION -->
  <rect x="425" y="145" width="120" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#14532d">Authentication</text>
  <text x="485" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#14532d">Decision</text>
  <!-- check -->
  <circle cx="475" cy="210" r="12" fill="#4ade80"/>
  <path d="M469 210 l4 5 l8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cross -->
  <circle cx="497" cy="210" r="12" fill="#f87171"/>
  <path d="M491 204 l12 12 M503 204 l-12 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="485" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#14532d">MATCH / NO MATCH</text>
  <text x="485" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#166534">FAR / FRR tradeoff</text>

  <!-- arrow 3 -->
  <line x1="400" y1="200" x2="423" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#c3)"/>

  <!-- 5. ACCESS CONTROLLER -->
  <rect x="570" y="145" width="110" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="625" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Access</text>
  <text x="625" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Controller</text>
  <text x="625" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Receive auth signal</text>
  <text x="625" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Apply access policy</text>
  <text x="625" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">Log event</text>

  <!-- arrow 4 -->
  <line x1="545" y1="200" x2="568" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#c4)"/>

  <!-- 6. DOOR -->
  <rect x="705" y="160" width="90" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="715" y="168" width="70" height="64" rx="3" fill="#e2e8f0"/>
  <rect x="765" y="185" width="8" height="28" rx="3" fill="#64748b"/>
  <text x="750" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#475569">Door</text>

  <!-- arrow 5 -->
  <line x1="680" y1="200" x2="703" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#c5)"/>

  <!-- OPTIONAL SECOND FACTOR (below) -->
  <rect x="280" y="300" width="265" height="54" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="412" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#92400e">Optional: Second Factor</text>
  <text x="412" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">Card / PIN — Combined with biometric for multi-factor</text>
  <text x="412" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">authentication where risk assessment requires it</text>

  <!-- dashed line from second factor up to matching engine -->
  <line x1="340" y1="300" x2="340" y2="255" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c6)"/>

  <!-- NOTES -->
  <rect x="20" y="315" width="240" height="108" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="32" y="333" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Architecture Notes</text>
  <text x="32" y="349" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• Matching can be on-reader (local),</text>
  <text x="32" y="362" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  on-card, or server-based</text>
  <text x="32" y="377" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• FAR/FRR balance depends on threshold,</text>
  <text x="32" y="390" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  environment and security policy</text>
  <text x="32" y="405" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">• Architecture varies by OEM and system</text>
  <text x="32" y="418" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">  design — diagram shows typical flow</text>

  <defs>
    <marker id="c1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#7c3aed"/></marker>
    <marker id="c2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ca8a04"/></marker>
    <marker id="c3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="c4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker>
    <marker id="c5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker>
    <marker id="c6" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f59e0b"/></marker>
  </defs>
</svg>
