<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data center visitor management reception workflow showing visitor arriving at reception for identity verification and host approval then receiving temporary badge and credential for controlled entry">
  <rect width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Visitor Management — Data Center Reception Workflow</text>

  <!-- VISITOR arrives -->
  <rect x="20" y="65" width="110" height="130" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="75" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#0369a1">Visitor</text>
  <!-- person icon -->
  <circle cx="75" cy="115" r="18" fill="#bfdbfe"/>
  <ellipse cx="75" cy="155" rx="22" ry="13" fill="#bfdbfe"/>
  <text x="75" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#0369a1">Arrives at facility</text>

  <!-- arrow 1 -->
  <line x1="130" y1="130" x2="158" y2="130" stroke="#0369a1" stroke-width="2" marker-end="url(#e1)"/>

  <!-- RECEPTION / CHECK-IN -->
  <rect x="160" y="65" width="140" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#6d28d9">Reception</text>
  <text x="230" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6d28d9">Check-In</text>
  <!-- desk icon -->
  <rect x="185" y="115" width="90" height="35" rx="4" fill="#7c3aed"/>
  <rect x="195" y="108" width="30" height="20" rx="3" fill="#c4b5fd"/>
  <!-- keyboard -->
  <rect x="235" y="115" width="30" height="8" rx="2" fill="#a78bfa"/>
  <text x="230" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">Register visitor</text>
  <text x="230" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">Log purpose &amp; host</text>
  <text x="230" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">Time window</text>

  <!-- arrow 2 -->
  <line x1="300" y1="130" x2="328" y2="130" stroke="#7c3aed" stroke-width="2" marker-end="url(#e2)"/>

  <!-- IDENTITY VERIFICATION -->
  <rect x="330" y="65" width="140" height="130" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#92400e">Identity</text>
  <text x="400" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#92400e">Verification</text>
  <!-- ID card icon -->
  <rect x="360" y="112" width="80" height="48" rx="5" fill="#f59e0b"/>
  <circle cx="378" cy="128" r="10" fill="#fef3c7"/>
  <rect x="395" y="118" width="38" height="5" rx="2" fill="#fef3c7"/>
  <rect x="395" y="128" width="28" height="4" rx="2" fill="#fef3c7"/>
  <rect x="395" y="137" width="33" height="4" rx="2" fill="#fef3c7"/>
  <text x="400" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">Govt ID scan</text>
  <text x="400" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">Photo capture</text>

  <!-- arrow 3 -->
  <line x1="470" y1="130" x2="498" y2="130" stroke="#ca8a04" stroke-width="2" marker-end="url(#e3)"/>

  <!-- HOST APPROVAL -->
  <rect x="500" y="65" width="130" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">Host</text>
  <text x="565" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#14532d">Approval</text>
  <!-- phone/email icon -->
  <rect x="540" y="110" width="50" height="36" rx="6" fill="#22c55e"/>
  <rect x="548" y="116" width="34" height="24" rx="2" fill="#dcfce7"/>
  <text x="565" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#14532d">✓ Approved</text>
  <text x="565" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#14532d">Notification sent</text>
  <text x="565" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#14532d">to host employee</text>
  <text x="565" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#14532d">Approval required</text>

  <!-- arrow 4 -->
  <line x1="630" y1="130" x2="658" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#e4)"/>

  <!-- BADGE / CREDENTIAL -->
  <rect x="660" y="65" width="140" height="130" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
  <text x="730" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#0369a1">Temporary</text>
  <text x="730" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#0369a1">Badge / Credential</text>
  <!-- badge icon -->
  <rect x="695" y="110" width="70" height="48" rx="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <text x="730" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#fff" font-weight="700">VISITOR</text>
  <text x="730" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#e0f2fe">Time-limited</text>
  <text x="730" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#e0f2fe">Zone-restricted</text>
  <text x="730" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#0369a1">Provisioned in</text>
  <text x="730" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#0369a1">access control</text>

  <!-- CONTROLLED ENTRY (bottom row) -->
  <rect x="20" y="255" width="780" height="120" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e293b">Controlled Entry — Visitor Access</text>

  <!-- Escort -->
  <rect x="40" y="292" width="155" height="68" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="117" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#92400e">Escort Required</text>
  <text x="117" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">Host or authorized</text>
  <text x="117" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">escort accompanies</text>
  <text x="117" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#a16207">visitor per policy</text>

  <!-- CCTV monitoring -->
  <rect x="215" y="292" width="155" height="68" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="292" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#14532d">CCTV Monitoring</text>
  <text x="292" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#166534">Entry documented</text>
  <text x="292" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#166534">Movement tracked</text>
  <text x="292" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#166534">Event-linked snapshots</text>

  <!-- Access control zones -->
  <rect x="390" y="292" width="155" height="68" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="467" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Zone-Limited Access</text>
  <text x="467" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">Only approved areas</text>
  <text x="467" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">Approved time window</text>
  <text x="467" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">Least privilege</text>

  <!-- Check-out + expiry -->
  <rect x="565" y="292" width="215" height="68" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="672" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#9f1239">Check-Out / Expiry</text>
  <text x="672" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#be123c">Badge returned</text>
  <text x="672" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#be123c">Credential revoked in</text>
  <text x="672" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#be123c">access control system</text>

  <!-- VISITOR MANAGEMENT SYSTEM box (bottom) -->
  <rect x="20" y="398" width="780" height="46" rx="8" fill="#1e293b"/>
  <text x="410" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Visitor Management System — Audit Trail</text>
  <text x="410" y="434" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#94a3b8">Complete record: registration · identity · approval · credential · access events · check-out · retention per policy</text>

  <!-- down arrow from credential to entry -->
  <line x1="730" y1="195" x2="730" y2="255" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="730" y1="255" x2="672" y2="292" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#e1)"/>

  <defs>
    <marker id="e1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#0369a1"/></marker>
    <marker id="e2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#7c3aed"/></marker>
    <marker id="e3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ca8a04"/></marker>
    <marker id="e4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#16a34a"/></marker>
  </defs>
</svg>
