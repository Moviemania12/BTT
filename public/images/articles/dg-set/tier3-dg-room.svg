<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="900" fill="#ffffff"/>

<text x="800" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">TIER III DG ROOM — N+1 DESIGN</text>
<text x="800" y="84" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Any one DG can be maintained — the other two carry full Data Center load</text>

<!-- N+1 label top -->
<rect x="680" y="100" width="240" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="800" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">N+1 REDUNDANCY</text>

<!-- 3 DG boxes at top -->
<!-- DG1: running -->
<rect x="80" y="170" width="380" height="200" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<rect x="80" y="170" width="380" height="52" rx="18" fill="#16a34a"/>
<text x="270" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">DG-1</text>
<text x="270" y="222" font-family="Arial,sans-serif" font-size="14" fill="#bbf7d0" text-anchor="middle">1500 kVA</text>
<text x="270" y="280" font-family="Arial,sans-serif" font-size="44" text-anchor="middle">🟢</text>
<text x="270" y="330" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">RUNNING</text>
<text x="270" y="356" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">412 kW — Load sharing</text>

<!-- DG2: running -->
<rect x="610" y="170" width="380" height="200" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<rect x="610" y="170" width="380" height="52" rx="18" fill="#16a34a"/>
<text x="800" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">DG-2</text>
<text x="800" y="222" font-family="Arial,sans-serif" font-size="14" fill="#bbf7d0" text-anchor="middle">1500 kVA</text>
<text x="800" y="280" font-family="Arial,sans-serif" font-size="44" text-anchor="middle">🟢</text>
<text x="800" y="330" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">RUNNING</text>
<text x="800" y="356" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">415 kW — Load sharing</text>

<!-- DG3: standby -->
<rect x="1140" y="170" width="380" height="200" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="1140" y="170" width="380" height="52" rx="18" fill="#64748b"/>
<text x="1330" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">DG-3 — STANDBY</text>
<text x="1330" y="222" font-family="Arial,sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">1500 kVA · N+1 spare</text>
<text x="1330" y="280" font-family="Arial,sans-serif" font-size="44" text-anchor="middle">⚪</text>
<text x="1330" y="330" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">STANDBY</text>
<text x="1330" y="356" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Auto starts if DG-1 or DG-2 fails</text>

<!-- Lines from DG1 and DG2 converging down to sync panel -->
<line x1="270" y1="374" x2="270" y2="440" stroke="#16a34a" stroke-width="3"/>
<line x1="270" y1="440" x2="800" y2="440" stroke="#16a34a" stroke-width="3"/>
<line x1="800" y1="374" x2="800" y2="440" stroke="#16a34a" stroke-width="3"/>
<line x1="1330" y1="374" x2="1330" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,5"/>
<line x1="1330" y1="440" x2="800" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,5"/>
<line x1="800" y1="440" x2="800" y2="474" stroke="#16a34a" stroke-width="3"/>
<polygon points="789,472 811,472 800,488" fill="#16a34a"/>

<!-- Sync Panel -->
<rect x="470" y="490" width="660" height="84" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="800" y="527" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e40af" text-anchor="middle">SYNC PANEL + COMMON BUS</text>
<text x="800" y="555" font-family="Arial,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Auto synchronizing · Load sharing · 415V bus</text>

<!-- Arrow down to ATS -->
<line x1="800" y1="578" x2="800" y2="614" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="789,612 811,612 800,628" fill="#e2e8f0"/>

<!-- ATS -->
<rect x="570" y="630" width="460" height="76" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="800" y="664" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5b21b6" text-anchor="middle">ATS / ATSS</text>
<text x="800" y="690" font-family="Arial,sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">Automatic Transfer Switch</text>

<!-- Arrow down to UPS -->
<line x1="800" y1="710" x2="800" y2="742" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="789,740 811,740 800,756" fill="#e2e8f0"/>

<!-- UPS and Server side by side -->
<rect x="470" y="758" width="300" height="100" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="620" y="800" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">UPS</text>
<text x="620" y="826" font-family="Arial,sans-serif" font-size="13" fill="#ea580c" text-anchor="middle">Battery bridge 10–15 min</text>
<text x="620" y="846" font-family="Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Covers DG start time</text>

<line x1="774" y1="808" x2="830" y2="808" stroke="#e2e8f0" stroke-width="3"/>
<polygon points="826,799 848,808 826,817" fill="#e2e8f0"/>

<rect x="852" y="758" width="278" height="100" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="991" y="800" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">IT LOAD</text>
<text x="991" y="824" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Servers · Cooling</text>
<text x="991" y="844" font-family="Arial,sans-serif" font-size="13" fill="#064e3b" font-weight="600">Always protected</text>

<!-- Left summary card -->
<rect x="60" y="490" width="380" height="370" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="250" y="524" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">TIER III MEANS</text>
<line x1="78" y1="534" x2="422" y2="534" stroke="#bbf7d0" stroke-width="1"/>
<text x="78" y="560" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">✓ Maintain 1 DG = others run</text>
<text x="78" y="584" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">✓ N = 2 DGs = full IT load</text>
<text x="78" y="608" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">✓ +1 = 1 spare DG standby</text>
<line x1="78" y1="626" x2="422" y2="626" stroke="#bbf7d0" stroke-width="1"/>
<text x="78" y="652" font-family="Arial,sans-serif" font-size="14" fill="#dc2626">✗ If DG-1 faults during peak,</text>
<text x="78" y="674" font-family="Arial,sans-serif" font-size="14" fill="#dc2626">  service MAY be impacted</text>
<line x1="78" y1="694" x2="422" y2="694" stroke="#bbf7d0" stroke-width="1"/>
<text x="78" y="720" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Uptime: 99.982%</text>
<text x="78" y="742" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Downtime: 1.6 hrs/year</text>
<text x="78" y="766" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Concurrent maintainability</text>
<rect x="78" y="792" width="344" height="50" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="250" y="812" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Tier IV = 2N fully independent</text>
<text x="250" y="832" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Zero shared components</text>
</svg>
