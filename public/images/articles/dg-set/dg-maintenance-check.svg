<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="900" fill="#ffffff"/>

<text x="800" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">DG SET DAILY / WEEKLY CHECK</text>
<text x="800" y="84" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">A Check — 6 items to verify before every shift handover</text>

<!-- 6 checklist items — 2 columns × 3 rows -->
<!-- Left column: x=60-770, Right column: x=830-1540 -->
<!-- Rows: y=120-270, y=300-450, y=480-630 -->

<!-- Item 1: Visual Inspection -->
<rect x="60" y="120" width="710" height="150" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<rect x="60" y="120" width="80" height="150" rx="16" fill="#16a34a"/>
<text x="100" y="202" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">👁</text>
<text x="210" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">VISUAL INSPECTION</text>
<text x="210" y="198" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Leaks:  oil · coolant · fuel</text>
<text x="210" y="220" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Belt condition:  cracks or fraying</text>
<text x="210" y="242" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Exhaust smoke:  grey = normal</text>
<text x="676" y="202" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#16a34a">✓</text>

<!-- Item 2: Fuel Check -->
<rect x="830" y="120" width="710" height="150" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<rect x="830" y="120" width="80" height="150" rx="16" fill="#f97316"/>
<text x="870" y="202" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⛽</text>
<text x="980" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#c2410c">FUEL CHECK</text>
<text x="980" y="198" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Day tank level:  above 50%?</text>
<text x="980" y="220" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Main tank level:  above 30%?</text>
<text x="980" y="242" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Transfer pump:  auto running?</text>
<text x="1446" y="202" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#f97316">✓</text>

<!-- Item 3: Oil Check -->
<rect x="60" y="300" width="710" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<rect x="60" y="300" width="80" height="150" rx="16" fill="#d97706"/>
<text x="100" y="382" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">🛢️</text>
<text x="210" y="350" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#92400e">OIL CHECK</text>
<text x="210" y="378" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Dipstick level:  between MIN-MAX</text>
<text x="210" y="400" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Oil colour:  amber OK  ·  black = change</text>
<text x="210" y="422" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">No milky appearance (coolant mixing)</text>
<text x="676" y="382" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#d97706">✓</text>

<!-- Item 4: Coolant -->
<rect x="830" y="300" width="710" height="150" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="830" y="300" width="80" height="150" rx="16" fill="#2563eb"/>
<text x="870" y="382" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">🌡️</text>
<text x="980" y="350" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e40af">COOLANT CHECK</text>
<text x="980" y="378" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Expansion tank:  level correct?</text>
<text x="980" y="400" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Colour:  green/blue inhibitor good</text>
<text x="980" y="422" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Radiator:  no blockage, fan spinning</text>
<text x="1446" y="382" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#2563eb">✓</text>

<!-- Item 5: Battery -->
<rect x="60" y="480" width="710" height="150" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="60" y="480" width="80" height="150" rx="16" fill="#7c3aed"/>
<text x="100" y="562" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">🔋</text>
<text x="210" y="530" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5b21b6">BATTERY CHECK</text>
<text x="210" y="558" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Voltage:  24VDC (or 12VDC) OK?</text>
<text x="210" y="580" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Terminals:  clean, no corrosion</text>
<text x="210" y="602" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Charger:  float charge active?</text>
<text x="676" y="562" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#7c3aed">✓</text>

<!-- Item 6: Test Run -->
<rect x="830" y="480" width="710" height="150" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<rect x="830" y="480" width="80" height="150" rx="16" fill="#dc2626"/>
<text x="870" y="562" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">▶️</text>
<text x="980" y="530" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">WEEKLY TEST RUN</text>
<text x="980" y="558" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">5–10 min no-load exercise run</text>
<text x="980" y="580" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">AMF cycle test:  auto start + transfer</text>
<text x="980" y="602" font-family="Arial,sans-serif" font-size="15" fill="#1e293b">Log book entry:  all readings recorded</text>
<text x="1446" y="562" font-family="Arial,sans-serif" font-size="36" text-anchor="middle" fill="#dc2626">✓</text>

<!-- Bottom: All checks summary -->
<rect x="60" y="680" width="1480" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="800" y="714" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">A CHECK = DAILY (operator)  ·  B CHECK = Monthly (service)  ·  C CHECK = 6-Monthly  ·  D CHECK = Annual</text>
<line x1="80" y1="726" x2="1520" y2="726" stroke="#e2e8f0" stroke-width="1"/>
<text x="800" y="756" font-family="Arial,sans-serif" font-size="16" fill="#dc2626" font-weight="700" text-anchor="middle">CRITICAL RULE:  Alarm acknowledged ≠ Alarm resolved</text>
<text x="800" y="780" font-family="Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Every alarm must create a work order and be verified closed — not just acknowledged on the screen</text>
<text x="800" y="806" font-family="Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Dead battery charger is the most common reason DG fails to start during a real grid outage</text>
<text x="800" y="832" font-family="Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">Use whichever comes first — hours OR calendar time — for B/C/D check scheduling</text>
</svg>
