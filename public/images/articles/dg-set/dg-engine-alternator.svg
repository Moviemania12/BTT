<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="900" fill="#ffffff"/>

<!-- Title -->
<text x="800" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">ENGINE + ALTERNATOR</text>
<text x="800" y="90" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">How diesel fuel becomes electricity — energy conversion chain</text>

<!-- ── 5 boxes horizontal ── -->
<!-- spacing: 5 boxes × 220 + 4 gaps × 56 = 1100+224=1324, start x=(1600-1324)/2=138 -->

<!-- Box 1: Fuel (x=138) -->
<rect x="60" y="300" width="240" height="180" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
<text x="180" y="358" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">⛽</text>
<text x="180" y="412" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">FUEL</text>
<text x="180" y="436" font-family="Arial,sans-serif" font-size="13" fill="#ea580c" text-anchor="middle">Diesel (HSD)</text>
<text x="180" y="454" font-family="Arial,sans-serif" font-size="13" fill="#ea580c" text-anchor="middle">Chemical energy</text>

<!-- Arrow 1→2 -->
<line x1="305" y1="390" x2="340" y2="390" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="336,382 354,390 336,398" fill="#e2e8f0"/>

<!-- Box 2: Engine (x=358) -->
<rect x="358" y="300" width="240" height="180" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="478" y="358" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">⚙️</text>
<text x="478" y="412" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">ENGINE</text>
<text x="478" y="436" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">Combustion</text>
<text x="478" y="454" font-family="Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">1500 RPM</text>

<!-- Arrow 2→3 -->
<line x1="603" y1="390" x2="638" y2="390" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="634,382 652,390 634,398" fill="#e2e8f0"/>
<!-- label above arrow -->
<text x="628" y="372" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">rotation</text>

<!-- Box 3: Shaft (coupling) - smaller, grey -->
<rect x="656" y="330" width="200" height="120" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="756" y="378" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">FLEX</text>
<text x="756" y="400" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">COUPLING</text>
<text x="756" y="422" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Connects shaft</text>

<!-- Arrow 3→4 -->
<line x1="861" y1="390" x2="896" y2="390" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="892,382 910,390 892,398" fill="#e2e8f0"/>

<!-- Box 4: Alternator -->
<rect x="914" y="300" width="240" height="180" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
<text x="1034" y="358" font-family="Arial,sans-serif" font-size="40" text-anchor="middle">🔄</text>
<text x="1034" y="412" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#164e63" text-anchor="middle">ALTERNATOR</text>
<text x="1034" y="436" font-family="Arial,sans-serif" font-size="13" fill="#0891b2" text-anchor="middle">Rotor + Stator</text>
<text x="1034" y="454" font-family="Arial,sans-serif" font-size="13" fill="#0891b2" text-anchor="middle">EMF induced</text>

<!-- Arrow 4→5 -->
<line x1="1159" y1="390" x2="1194" y2="390" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
<polygon points="1190,382 1208,390 1190,398" fill="#e2e8f0"/>
<text x="1184" y="372" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">AC power</text>

<!-- Box 5: Output -->
<rect x="1212" y="300" width="320" height="180" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="1372" y="352" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">⚡</text>
<text x="1372" y="400" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">415V  50Hz</text>
<text x="1372" y="424" font-family="Arial,sans-serif" font-size="15" fill="#16a34a" text-anchor="middle">3-phase AC</text>
<text x="1372" y="446" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Same as grid supply</text>
<text x="1372" y="466" font-family="Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">→ ATS → LVMDB</text>

<!-- Bottom explanation cards -->
<rect x="60" y="530" width="240" height="100" rx="12" fill="#fafafa" stroke="#f0f0f0" stroke-width="1"/>
<text x="180" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">ENERGY TYPE</text>
<text x="180" y="582" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f97316" text-anchor="middle">Chemical</text>
<text x="180" y="604" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Diesel fuel</text>

<rect x="358" y="530" width="240" height="100" rx="12" fill="#fafafa" stroke="#f0f0f0" stroke-width="1"/>
<text x="478" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">ENERGY TYPE</text>
<text x="478" y="582" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">Mechanical</text>
<text x="478" y="604" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Rotating shaft</text>

<rect x="914" y="530" width="240" height="100" rx="12" fill="#fafafa" stroke="#f0f0f0" stroke-width="1"/>
<text x="1034" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">PRINCIPLE</text>
<text x="1034" y="582" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0891b2" text-anchor="middle">Electromagnetic</text>
<text x="1034" y="600" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Induction</text>
<text x="1034" y="618" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Faraday's law</text>

<rect x="1212" y="530" width="320" height="100" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="1372" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">RESULT</text>
<text x="1372" y="582" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">Electrical Energy</text>
<text x="1372" y="604" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">Powers Data Center</text>

<!-- Formula bottom -->
<text x="800" y="700" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Frequency Formula:  f = N × P ÷ 120  →  1500 RPM × 4 poles ÷ 120 = 50 Hz</text>
<text x="800" y="730" font-family="Arial,sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Governor controls RPM  →  AVR controls Voltage  →  Output stays stable under load changes</text>
</svg>
